[project]
name = "dox"
version = "0.2.0"
description = "A generic docs-as-code checker driven by a schema repo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.scripts]
dox = "dox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dox"]
